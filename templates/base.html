{% load static %}
<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}放射線科 点検管理{% endblock %}</title>
  <link rel="stylesheet" href="{% static 'css/app.css' %}">
</head>
<body>
<header class="site-header">
  <div class="container header-inner">
    <a class="brand" href="{% url 'dashboard' %}">放射線科 点検管理</a>
    {% if user.is_authenticated %}
      <nav>
        <a href="{% url 'dashboard' %}">本日の点検</a>
        <a href="{% url 'history' %}">履歴</a>
        {% if user.is_staff %}<a href="/admin/">管理</a>{% endif %}
        <form action="{% url 'logout' %}" method="post" class="inline-form">
          {% csrf_token %}
          <button class="link-button" type="submit">ログアウト</button>
        </form>
      </nav>
    {% endif %}
  </div>
</header>
<main class="container">
  {% if messages %}
    {% for message in messages %}<div class="message">{{ message }}</div>{% endfor %}
  {% endif %}
  {% block content %}{% endblock %}
</main>
</body>
</html>
