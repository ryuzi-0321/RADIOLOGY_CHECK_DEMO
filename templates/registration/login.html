{% extends 'base.html' %}
{% block title %}ログイン{% endblock %}
{% block content %}
<div class="login-card card narrow">
  <h1>ログイン</h1>
  <form method="post">
    {% csrf_token %}
    {{ form.non_field_errors }}
    <label>ユーザー名{{ form.username }}</label>
    <label>パスワード{{ form.password }}</label>
    <button class="button primary full" type="submit">ログイン</button>
  </form>
</div>
{% endblock %}
